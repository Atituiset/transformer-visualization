<!DOCTYPE html>
<!--
  ============================================================
  Transformer 架构交互式可视化学习应用
  作者：atituiset
  日期：2026-08-24
  版本：v1.0.0
  说明：单文件纯前端应用。TensorFlow.js 完成前向推理模拟，
        D3.js 绘制架构图与注意力热力图，KaTeX 渲染公式。
  ============================================================
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer 架构交互式可视化</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%231a237e"/><text x="16" y="22" font-size="16" text-anchor="middle" fill="%23ff6f00" font-family="sans-serif" font-weight="bold">T</text></svg>'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============================================================
   样式：主题变量（spec 配色：主色深蓝 / 强调琥珀 / 浅灰背景）
   ============================================================ */
:root{
  --c-primary:#1a237e;
  --c-primary-light:#3949ab;
  --c-accent:#ff6f00;
  --c-bg:#f5f7fa;
  --c-card:#ffffff;
  --c-text:#1c2430;
  --c-text-dim:#5a6472;
  --c-border:#dde3ec;
  --c-code-bg:#eef1f7;
  --c-ok:#2e7d32;
  --font-main:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Fira Code",Consolas,"Noto Sans SC",monospace;
}
html[data-theme="dark"]{
  --c-primary:#8c9eff;
  --c-primary-light:#aab6ff;
  --c-accent:#ffa040;
  --c-bg:#0f1420;
  --c-card:#171e30;
  --c-text:#e8ecf4;
  --c-text-dim:#9aa6ba;
  --c-border:#2a3450;
  --c-code-bg:#101726;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-main);
  font-size:14px;
  color:var(--c-text);
  background:var(--c-bg);
  display:flex;flex-direction:column;
  transition:background .25s,color .25s;
}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 18px;min-height:52px;
  background:linear-gradient(90deg,var(--c-primary),var(--c-primary-light));
  color:#fff;
  box-shadow:0 2px 8px rgba(20,30,80,.25);
}
html[data-theme="dark"] #topbar{color:#0f1420;}
#topbar h1{font-size:17px;font-weight:700;letter-spacing:.5px;}
#version-tag{
  font-family:var(--font-mono);font-size:12px;
  padding:2px 8px;border-radius:10px;
  border:1px solid currentColor;opacity:.85;
}
#topbar .spacer{flex:1;}

/* ---------- 按钮 / 表单控件 ---------- */
.btn{
  font-family:var(--font-main);font-size:14px;
  border:1px solid var(--c-border);border-radius:8px;
  background:var(--c-card);color:var(--c-text);
  padding:7px 14px;cursor:pointer;
  transition:transform .06s, box-shadow .15s, opacity .15s;
}
.btn:hover{box-shadow:0 2px 8px rgba(30,40,90,.18);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--c-primary);border-color:transparent;color:#fff;font-weight:600;}
html[data-theme="dark"] .btn-primary{color:#0f1420;}
.btn-accent{background:var(--c-accent);border-color:transparent;color:#fff;font-weight:600;}
select,textarea{
  font-family:var(--font-main);font-size:14px;color:var(--c-text);
  background:var(--c-card);border:1px solid var(--c-border);border-radius:8px;
  padding:6px 8px;width:100%;
}
textarea{resize:vertical;min-height:56px;line-height:1.5;}
label{display:block;margin:10px 0 4px;color:var(--c-text-dim);font-size:13px;}

/* ---------- 三栏主布局（spec：20% / 55% / 25%） ---------- */
#layout{
  flex:1;display:grid;
  grid-template-columns:minmax(200px,20%) minmax(0,55%) minmax(250px,25%);
  gap:12px;padding:12px;
  align-items:start;
}
.panel{
  background:var(--c-card);
  border:1px solid var(--c-border);
  border-radius:12px;
  padding:14px;
  box-shadow:0 1px 4px rgba(25,35,70,.06);
}
.panel h2{
  font-size:15px;color:var(--c-primary);
  border-bottom:2px solid var(--c-accent);
  padding-bottom:6px;margin-bottom:10px;font-weight:700;
}
html[data-theme="dark"] .panel h2{color:var(--c-primary-light);}

/* ---------- 左栏：历史时间轴 ---------- */
#panel-timeline{max-height:calc(100vh - 90px);overflow-y:auto;}
#timeline-list{list-style:none;position:relative;padding-left:22px;}
#timeline-list::before{
  content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:var(--c-border);
}
.tl-item{position:relative;margin-bottom:16px;cursor:pointer;}
.tl-item::before{
  content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--c-card);border:2px solid var(--c-primary);
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.tl-item:hover::before,.tl-item.active::before{
  background:var(--c-accent);border-color:var(--c-accent);
  box-shadow:0 0 0 4px rgba(255,111,0,.18);
}
.tl-year{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--c-primary);}
.tl-name{font-weight:600;margin:1px 0;}
.tl-paper{color:var(--c-text-dim);font-size:12.5px;line-height:1.45;}
.tl-contrib{margin-top:3px;font-size:13px;line-height:1.45;}
.tl-item.active .tl-year{color:var(--c-accent);}
#timeline-note{
  margin-top:10px;padding:8px 10px;border-radius:8px;display:none;
  background:rgba(255,111,0,.09);border-left:3px solid var(--c-accent);
  font-size:13px;line-height:1.5;
}
#timeline-note.show{display:block;}

/* ---------- 中栏：架构图 + 图表 + 详情 ---------- */
#panel-arch{display:flex;flex-direction:column;gap:12px;}
#arch-wrap{
  position:relative;background:var(--c-card);
  border:1px solid var(--c-border);border-radius:12px;
  overflow:hidden;
}
#arch-svg{display:block;width:100%;height:auto;}
.arch-tooltip{
  position:absolute;pointer-events:none;z-index:30;
  max-width:260px;padding:6px 10px;border-radius:8px;
  background:var(--c-text);color:var(--c-bg);
  font-size:12.5px;line-height:1.45;opacity:0;
  transition:opacity .12s;
}
#chart-area{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;}
.subcard{
  background:var(--c-card);border:1px solid var(--c-border);
  border-radius:12px;padding:10px 12px;
}
.subcard h3{font-size:13.5px;color:var(--c-text-dim);font-weight:600;margin-bottom:6px;}
#pe-wave svg{display:block;}
#heatmap-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
#heatmap-controls .seg{display:inline-flex;border:1px solid var(--c-border);border-radius:8px;overflow:hidden;}
#heatmap-controls .seg button{
  border:none;background:transparent;color:var(--c-text);
  font-size:13px;padding:4px 10px;cursor:pointer;font-family:var(--font-mono);
}
#heatmap-controls .seg button.on{background:var(--c-primary);color:#fff;}
html[data-theme="dark"] #heatmap-controls .seg button.on{color:#0f1420;}
.hm-scroll{overflow-x:auto;}
#attn-heatmap svg{display:block;}
.hm-tip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;
  padding:5px 9px;border-radius:6px;font-size:12.5px;font-family:var(--font-mono);
  background:var(--c-text);color:var(--c-bg);transition:opacity .1s;white-space:nowrap;
}

/* SVG 结构图节点 */
#arch-svg .node rect{
  fill:var(--c-card);stroke:var(--c-primary);stroke-width:1.4;rx:9;
  transition:stroke .15s,filter .15s,opacity .2s;
}
html[data-theme="dark"] #arch-svg .node rect{fill:#1d2740;}
#arch-svg .node text{fill:var(--c-text);font-size:13.5px;font-weight:600;}
#arch-svg .node .sub{fill:var(--c-text-dim);font-size:11.5px;font-weight:400;}
#arch-svg .node.frame rect{stroke-dasharray:6 4;stroke-width:1.2;}
#arch-svg .edge{stroke:var(--c-text-dim);stroke-width:1.4;fill:none;marker-end:url(#arrow);}
#arch-svg .edge.residual{stroke-dasharray:5 4;stroke:var(--c-accent);}
#arch-svg .node.dim{opacity:.28;}
#arch-svg .node.active rect{
  stroke:var(--c-accent);stroke-width:2.6;
  filter:drop-shadow(0 0 6px rgba(255,111,0,.65));
}
#arch-svg .node.active text{fill:var(--c-accent);}
#arch-svg .node{cursor:pointer;}
#arch-svg .col-title{fill:var(--c-primary);font-size:14px;font-weight:700;}
html[data-theme="dark"] #arch-svg .col-title{fill:var(--c-primary-light);}

/* 详情面板 */
#detail-panel{min-height:120px;}
#detail-panel .dp-title{
  font-size:15px;font-weight:700;color:var(--c-primary);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
html[data-theme="dark"] #detail-panel .dp-title{color:var(--c-primary-light);}
.dp-sec{margin-top:8px;}
.dp-sec .dp-label{
  display:inline-block;font-size:12px;color:var(--c-accent);
  font-weight:700;letter-spacing:1px;margin-bottom:4px;
}
.dp-formula{padding:4px 2px;overflow-x:auto;}
.katex{font-size:1.02em;}
.dp-shapes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;}
.dp-shapes .arr{color:var(--c-accent);}
.dp-shapes .shape{background:var(--c-code-bg);padding:2px 7px;border-radius:6px;}
.dp-code{
  background:var(--c-code-bg);border-radius:8px;padding:9px 11px;
  font-family:var(--font-mono);font-size:12.5px;line-height:1.55;
  overflow-x:auto;white-space:pre;
}
.dp-params{font-family:var(--font-mono);font-size:13px;}
.dp-empty{color:var(--c-text-dim);line-height:1.6;}

/* ---------- 右栏：数据流控制 ---------- */
#panel-flow{max-height:calc(100vh - 90px);overflow-y:auto;}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.chip{
  font-family:var(--font-mono);font-size:13px;
  background:rgba(26,35,126,.08);border:1px solid var(--c-primary-light);
  color:var(--c-primary);border-radius:6px;padding:2px 8px;
}
html[data-theme="dark"] .chip{background:rgba(140,158,255,.12);color:var(--c-primary-light);}
#run-btns{display:flex;gap:8px;margin-top:12px;}
#run-btns .btn{flex:1;}
#step-log{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:6px;}
#step-log li{
  border:1px solid var(--c-border);border-left:3px solid var(--c-primary-light);
  border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.5;
  animation:logIn .25s ease both;
}
@keyframes logIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
#step-log li.current{border-left-color:var(--c-accent);background:rgba(255,111,0,.07);}
#step-log li.done{opacity:.75;}
.log-step{font-weight:700;}
.log-shape{font-family:var(--font-mono);color:var(--c-primary);}
.log-meta{font-family:var(--font-mono);font-size:12px;color:var(--c-text-dim);display:block;margin-top:2px;}
.log-note{color:var(--c-text-dim);font-size:12.5px;font-style:italic;}
.bar-row{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;margin-top:3px;}
.bar-row .bar-track{flex:1;height:10px;background:var(--c-code-bg);border-radius:5px;overflow:hidden;}
.bar-row .bar-fill{height:100%;background:var(--c-accent);}
#tensor-tracker{
  margin-top:10px;font-family:var(--font-mono);font-size:12.5px;
  background:var(--c-code-bg);border-radius:8px;padding:8px 10px;line-height:1.6;
}
#tensor-tracker b{color:var(--c-primary);}

/* 导出代码弹层 */
#export-box{margin-top:10px;display:none;}
#export-box.show{display:block;}
.copy-feedback{color:var(--c-ok);font-size:12.5px;margin-left:8px;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:5px;}

/* 响应式：1366×768 及以上保证可用，更窄时收窄间距 */
@media (max-width:1440px){
  #layout{gap:9px;padding:9px;}
}
@media (max-width:1366px){
  body{font-size:14px;}
  #topbar h1{font-size:16px;}
}
@media (max-width:1024px){
  #layout{grid-template-columns:1fr;}
  #panel-timeline,#panel-flow{max-height:none;}
}
</style>
</head>
<body>

<header id="topbar">
  <h1>Transformer 架构交互式可视化</h1>
  <span id="version-tag">v1.0.0</span>
  <span class="spacer"></span>
  <button id="theme-toggle" class="btn" title="切换深浅主题">🌙 深色模式</button>
</header>

<main id="layout">

  <!-- ============ 左栏：历史时间轴 ============ -->
  <aside id="panel-timeline" class="panel">
    <h2>历史演进</h2>
    <ol id="timeline-list"></ol>
    <div id="timeline-note"></div>
  </aside>

  <!-- ============ 中栏：架构解剖 ============ -->
  <section id="panel-arch">
    <div id="arch-wrap" class="subcard">
      <h3 style="margin-bottom:4px;">模型结构 <span style="font-weight:400;font-size:12px;">（悬停查看说明 · 点击查看详情）</span></h3>
      <svg id="arch-svg" role="img" aria-label="Transformer 编码器-解码器结构图"></svg>
      <div class="arch-tooltip" id="arch-tooltip"></div>
    </div>

    <div id="chart-area">
      <div class="subcard" id="pe-wave-card">
        <h3>位置编码波形</h3>
        <div id="pe-wave"></div>
      </div>
      <div class="subcard" id="heatmap-card">
        <h3>注意力热力图 <span style="font-weight:400;font-size:12px;">（行=Query，列=Key）</span></h3>
        <div id="heatmap-controls">
          <span style="font-size:13px;color:var(--c-text-dim);">Head:</span>
          <span class="seg" id="head-seg"></span>
          <span class="seg" id="stage-seg">
            <button data-stage="post" class="on">Softmax 后</button>
            <button data-stage="pre">Softmax 前</button>
          </span>
          <span class="seg" id="kind-seg" style="display:none;">
            <button data-kind="self" class="on">自注意力</button>
            <button data-kind="cross">交叉注意力</button>
          </span>
          <select id="layer-select" style="width:auto;"></select>
        </div>
        <div class="hm-scroll"><div id="attn-heatmap"></div></div>
        <div class="hm-tip" id="hm-tip"></div>
      </div>
    </div>

    <div class="subcard" id="detail-panel">
      <div class="dp-empty">点击左侧结构图中任意模块，此处将展示其数学公式、张量形状变化、核心代码与参数量。</div>
    </div>
  </section>

  <!-- ============ 右栏：数据流演示 ============ -->
  <aside id="panel-flow" class="panel">
    <h2>数据流演示</h2>

    <label for="input-text">输入文本</label>
    <textarea id="input-text" rows="2">我 爱 自然语言处理</textarea>
    <div id="token-chips" class="chip-row" title="分词结果"></div>

    <label for="preset-select">预设句子</label>
    <select id="preset-select"></select>

    <fieldset style="border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;margin-top:12px;">
      <legend style="font-size:13px;color:var(--c-text-dim);padding:0 4px;">超参数</legend>
      <label for="hp-d-model">d_model（隐藏维度）</label>
      <select id="hp-d-model">
        <option value="512" selected>512</option>
        <option value="256">256</option>
        <option value="128">128</option>
      </select>
      <label for="hp-num-heads">num_heads（注意力头数）</label>
      <select id="hp-num-heads">
        <option value="8" selected>8</option>
        <option value="4">4</option>
        <option value="2">2</option>
      </select>
      <label for="hp-num-layers">num_layers（层数 N）</label>
      <select id="hp-num-layers">
        <option value="6" selected>6</option>
        <option value="3">3</option>
        <option value="1">1</option>
      </select>
      <label for="hp-dropout">dropout_rate</label>
      <select id="hp-dropout">
        <option value="0.1" selected>0.1</option>
        <option value="0.0">0.0</option>
      </select>
    </fieldset>

    <div id="param-summary" style="margin-top:10px;font-size:13px;line-height:1.7;"></div>

    <div id="run-btns">
      <button id="run-forward" class="btn btn-primary">▶ 开始前向传播</button>
      <button id="run-decoder" class="btn btn-accent">⏩ Decoder 演示</button>
    </div>

    <ol id="step-log"></ol>

    <div id="tensor-tracker"><b>当前张量</b><br>待运行…</div>

    <div id="export-box">
      <div style="display:flex;align-items:center;">
        <button id="copy-export" class="btn" style="font-size:13px;">📋 复制代码</button>
        <span class="copy-feedback" id="copy-feedback"></span>
      </div>
      <pre class="dp-code" id="export-pre" style="margin-top:6px;"></pre>
    </div>
  </aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script>
/* ============================================================
   模块0：通用工具函数
   ============================================================ */
/** 千分位格式化整数 */
function fmtNum(n){ return n.toLocaleString('en-US'); }
/** 张量形状数组 → "[1, 5, 512]" 格式文本 */
function fmtShape(shapeArr){ return '[' + shapeArr.join(', ') + ']'; }

/* ============================================================
   模块1：配置管理（spec §5 超参数面板的数据源）
   ============================================================ */
const Config = {
  d_model: 512,       // 隐藏维度（512/256/128）
  num_heads: 8,       // 注意力头数（8/4/2）
  num_layers: 6,      // 编码器层数 N（6/3/1）
  d_ff: 2048,         // 前馈网络中间维度，恒为 4 × d_model（spec 示例 512→2048）
  dropout_rate: 0.1   // 仅影响展示与导出代码；演示阶段不做训练，前向时恒等
};

/* ============================================================
   模块2：参数量统计
   ============================================================ */
/**
 * 闭式公式计算当前配置的参数量（各线性层含偏置）：
 *   Embedding:            V × d_model
 *   每层 Encoder/Decoder: MHA 4·(d²+d)
 *                       + FFN (2·d·f + f + d)
 *                       + LayerNorm×2 (4·d)
 *   输出投影（Decoder 演示用）: V×d + V
 * @param {{d_model:number,d_ff:number,num_layers:number}} cfg 当前配置
 * @param {number} vocabSize 词表大小 V
 * @returns {{embedding:number,perLayer:number,encoderTotal:number,outputProj:number,total:number}}
 */
function countParams(cfg, vocabSize){
  const { d_model: d, d_ff: f, num_layers: L } = cfg;
  const perLayer = 4*(d*d + d) + (2*d*f + f + d) + 4*d;
  return {
    embedding:    vocabSize * d,
    perLayer,
    encoderTotal: L * perLayer,
    outputProj:   vocabSize * d + vocabSize,
    total:        vocabSize * d + L * perLayer
  };
}
/* 占位守卫：T3 接入真实词表后由 Vocab.length 提供词表大小 */
const __VOCAB_PLACEHOLDER__ = 40;

/** 右栏「参数量估算」摘要渲染（T3 前用占位词表大小 40） */
function renderParamSummary(){
  const V = (window.Vocab && window.Vocab.length) || __VOCAB_PLACEHOLDER__;
  const p = countParams(Config, V);
  document.getElementById('param-summary').innerHTML =
    '<b style="color:var(--c-primary);">参数量估算</b>' +
    ' <span style="color:var(--c-text-dim);">(V=' + V + ', d=' + Config.d_model +
    ', h=' + Config.num_heads + ', N=' + Config.num_layers + ')</span><br>' +
    'Embedding：' + fmtNum(p.embedding) + '<br>' +
    '每层 Encoder：' + fmtNum(p.perLayer) + '<br>' +
    'Encoder 总计（' + Config.num_layers + ' 层）：<b>' + fmtNum(p.encoderTotal) + '</b>';
}

/* ============================================================
   模块3：分词器（设计决策 D5：词典贪婪最长匹配 + 回退规则）
   ============================================================ */
class Tokenizer {
  constructor(){
    /** 多字词词典：key 为原始串，value 为拆分后的目标词序列 */
    this.lexicon = new Map([
      ['自然语言处理', ['自然','语言','处理']],
      ['机器学习',     ['机器','学习']],
      ['深度学习',     ['深度','学习']],
      ['神经网络',     ['神经','网络']],
      ['注意力机制',   ['注意力','机制']],
      ['人工智能',     ['人工','智能']],
      ['transformer',  ['transformer']]
    ]);
    /** 可匹配词集合（贪婪最长匹配的目标） */
    this.words = new Set();
    for(const exp of this.lexicon.values()) exp.forEach(w => this.words.add(w));
    this.maxLen = Math.max(...[...this.words].map(w => w.length));
  }
  /**
   * 分词主流程：①按空白切段 ②段内贪婪最长词典匹配
   * ③未命中时连续 [A-Za-z0-9] 合并为一个 token ④其余（CJK 等）逐字切分
   * @param {string} text 原始输入
   * @returns {string[]} token 序列
   */
  tokenize(text){
    const out = [];
    for(const seg of String(text).trim().split(/\s+/)){
      if(!seg) continue;
      let i = 0;
      while(i < seg.length){
        /* 贪婪最长匹配 */
        let hit = null;
        for(let len = Math.min(this.maxLen, seg.length - i); len >= 2; len--){
          const w = seg.slice(i, i + len);
          if(this.words.has(w)){ hit = w; break; }
        }
        if(hit){ out.push(hit); i += hit.length; continue; }
        /* 英文/数字连续段合并为一个 token */
        if(/[A-Za-z0-9]/.test(seg[i])){
          let j = i;
          while(j < seg.length && /[A-Za-z0-9]/.test(seg[j])) j++;
          out.push(seg.slice(i, j)); i = j;
          continue;
        }
        /* 其余单字符 */
        out.push(seg[i]); i++;
      }
    }
    return out;
  }
  /** @returns {string[]} 预设示例句 */
  getPresets(){
    return ['我 爱 自然语言处理', 'Transformer 是 深度学习 模型',
            '注意力机制 很 强大', 'Hello Transformer'];
  }
  /**
   * 构建词表：<pad>/<bos>/<eos> 特殊 token + 词典全部目标词 + 预设句覆盖。
   * @returns {string[]}
   */
  buildVocab(){
    const set = new Set(['<pad>','<bos>','<eos>','<unk>']);
    this.words.forEach(w => set.add(w));
    for(const p of this.getPresets())
      for(const t of this.tokenize(p)) set.add(t);
    return [...set];
  }
}

const tokenizer = new Tokenizer();
window.Vocab = tokenizer.buildVocab();

/** 右栏 token 芯片渲染（随输入实时刷新） */
function renderTokenChips(){
  const toks = tokenizer.tokenize(document.getElementById('input-text').value);
  document.getElementById('token-chips').innerHTML =
    toks.map(t => '<span class="chip">' + t + '</span>').join('');
}

(function initTokenizerUI(){
  const sel = document.getElementById('preset-select');
  sel.innerHTML = tokenizer.getPresets()
    .map(s => '<option>' + s + '</option>').join('');
  sel.addEventListener('change', e => {
    document.getElementById('input-text').value = e.target.value;
    renderTokenChips();
  });
  document.getElementById('input-text').addEventListener('input', renderTokenChips);
  renderTokenChips();
})();

/* ============================================================
   模块4：位置编码
   PE(pos, 2i)   = sin(pos / 10000^(2i/d_model))
   PE(pos, 2i+1) = cos(pos / 10000^(2i/d_model))
   ============================================================ */
class PositionalEncoding {
  /**
   * 生成位置编码矩阵。
   * @param {number} maxLen 最大序列长度
   * @param {number} dModel 隐藏维度
   * @returns {tf.Tensor} 形状 [1, maxLen, dModel]
   */
  static encode(maxLen, dModel){
    /* 纯 JS 填充（公式直观、无拼接技巧负担），再包为张量 */
    const pe = new Float32Array(maxLen * dModel);
    for(let pos = 0; pos < maxLen; pos++){
      for(let i = 0; i < dModel; i += 2){
        const denom = Math.pow(10000, (2 * i) / dModel);
        pe[pos * dModel + i]     = Math.sin(pos / denom); // 偶数维
        if(i + 1 < dModel)
          pe[pos * dModel + i + 1] = Math.cos(pos / denom); // 奇数维
      }
    }
    return tf.tensor3d(pe, [1, maxLen, dModel]);
  }
}

/* ---------- 位置编码波形图（手写 SVG polyline，X=pos，Y=[-1,1]） ---------- */
const PEWave = {
  /** 展示的维度索引（超出 d_model 时自动截断过滤） */
  DIMS: [0, 1, 4, 5, 16, 17, 64, 65],
  W: 300, H: 170, PAD_L: 30, PAD_B: 22,

  /**
   * 绘制 seq_len 个位置、当前 d_model 下指定维度的波形。
   * @param {number} seqLen 序列长度
   * @param {number} dModel 当前隐藏维度
   */
  render(seqLen, dModel){
    const host = document.getElementById('pe-wave');
    const dims = this.DIMS.filter(d => d < dModel);
    /* 多取一些位置让曲线更平滑（至少 32 个点） */
    const data = tf.tidy(() =>
      PositionalEncoding.encode(Math.max(seqLen, 32), dModel).arraySync()[0]);
    const xs = v => this.PAD_L + v / Math.max(seqLen - 1, 1) * (this.W - this.PAD_L);
    const ys = v => (this.H - this.PAD_B) / 2 - v * ((this.H - this.PAD_B) / 2 - 8);
    const colors = ['#1a237e','#ff6f00','#2e7d32','#c62828',
                    '#00838f','#6a1b9a','#ef6c00','#37474f'];
    let svg = '<svg width="' + this.W + '" height="' + this.H +
              '" role="img" aria-label="位置编码波形">';
    svg += '<line x1="' + this.PAD_L + '" y1="' + ys(0) + '" x2="' + this.W +
           '" y2="' + ys(0) + '" stroke="var(--c-border)" stroke-dasharray="3 3"/>';
    svg += '<text x="2" y="' + (ys(1) + 4) + '" font-size="11" fill="var(--c-text-dim)">+1</text>';
    svg += '<text x="2" y="' + (ys(-1) + 4) + '" font-size="11" fill="var(--c-text-dim)">-1</text>';
    svg += '<text x="' + this.W + '" y="' + (this.H - 6) +
           '" font-size="11" fill="var(--c-text-dim)" text-anchor="end">pos→</text>';
    dims.forEach((d, k) => {
      const pts = [];
      for(let p = 0; p < seqLen; p++) pts.push(xs(p).toFixed(1) + ',' + ys(data[p][d]).toFixed(1));
      const dimLabel = 'dim ' + d + (d % 2 ? '(cos)' : '(sin)');
      svg += '<polyline points="' + pts.join(' ') +
             '" fill="none" stroke="' + colors[k % colors.length] +
             '" stroke-width="1.6" stroke-linejoin="round"><title>' + dimLabel + '</title></polyline>';
    });
    svg += '</svg>';
    host.innerHTML = svg;
    host.title = '曲线对应维度：' + dims.join(', ');
  }
};

/* ============================================================
   模块5：核心注意力算子
   Attention(Q,K,V) = softmax(QKᵀ / √dk + mask) V
   ============================================================ */
/**
 * 生成因果掩码（下三角 0，其余 -1e9），广播到 [1,1,L,L]。
 * @param {number} L 序列长度
 * @returns {tf.Tensor}
 */
function causalMask(L){
  return tf.tidy(() => tf.where(
    tf.greater(tf.range(0, L).reshape([1, L]),
               tf.range(0, L).reshape([L, 1])),
    tf.fill([L, L], -1e9), tf.zeros([L, L])
  ).reshape([1, 1, L, L]));
}

/** Glorot 初始化（√(2/(fanIn+fanOut)) 标准差的正态近似） */
function glorotInit(shape){
  const std = Math.sqrt(2 / (shape[0] + shape[1]));
  return tf.randomNormal(shape, 0, std);
}
/** 张量包装为可训练变量并立即释放初始化器（防后端缓冲泄漏） */
function toVar(t){
  const v = tf.variable(t);
  t.dispose();
  return v;
}

class ScaledDotProductAttention {
  /**
   * 单头缩放点积注意力（整个计算包在 tidy 中，张量仅 output 逃逸）。
   * @param {tf.Tensor} Q [B,H,Lq,dk]
   * @param {tf.Tensor} K [B,H,Lk,dk]
   * @param {tf.Tensor} V [B,H,Lk,dv]
   * @param {tf.Tensor|null} maskAdd 可广播到 [B,H,Lq,Lk] 的加性掩码
   * @returns {{output:tf.Tensor, pre:number[][][], post:number[][][]}}
   *          pre=缩放后未掩码分数、post=掩码后 softmax 概率（[H,L,L] 快照）
   */
  forward(Q, K, V, maskAdd = null){
    return tf.tidy(() => {
      const dk = Q.shape[Q.shape.length - 1];
      const scores  = tf.matMul(Q, K, false, true).div(Math.sqrt(dk));
      const masked  = maskAdd ? scores.add(maskAdd) : scores;
      const weights = tf.softmax(masked, -1);
      const pre  = scores.arraySync()[0];
      const post = weights.arraySync()[0];
      return { output: tf.matMul(weights, V), pre, post };
    });
  }
}

class MultiHeadAttention {
  /**
   * @param {number} dModel 隐藏维度 d（需被头数整除）
   * @param {number} numHeads 头数 h
   */
  constructor(dModel, numHeads){
    this.dModel = dModel;
    this.numHeads = numHeads;
    this.dh = dModel / numHeads;
    this.WQ = toVar(glorotInit([dModel, dModel]));
    this.WK = toVar(glorotInit([dModel, dModel]));
    this.WV = toVar(glorotInit([dModel, dModel]));
    this.WO = toVar(glorotInit([dModel, dModel]));
    this.bQ = toVar(tf.zeros([dModel]));
    this.bK = toVar(tf.zeros([dModel]));
    this.bV = toVar(tf.zeros([dModel]));
    this.bO = toVar(tf.zeros([dModel]));
    this.sdpa = new ScaledDotProductAttention();
  }
  /** [B,L,D] → [B,H,L,dh]：拆出多头 */
  splitHeads(x){
    const B = x.shape[0], L = x.shape[1];
    return x.reshape([B, L, this.numHeads, this.dh]).transpose([0, 2, 1, 3]);
  }
  /** [B,H,L,dh] → [B,L,D]：合并多头 */
  combineHeads(x){
    const B = x.shape[0], L = x.shape[2];
    return x.transpose([0, 2, 1, 3]).reshape([B, L, this.dModel]);
  }
  /**
   * 多头注意力前向。自注意力传同一张量；交叉注意力 Q 来自解码器、K/V 来自编码器输出。
   * @param {tf.Tensor} Qin [B,Lq,d]
   * @param {tf.Tensor} Kin [B,Lk,d]
   * @param {tf.Tensor} Vin [B,Lk,d]
   * @param {tf.Tensor|null} maskAdd 加性掩码
   * @returns {{output:tf.Tensor, weights:{pre:number[][][],post:number[][][]}}}
   */
  forward(Qin, Kin, Vin, maskAdd = null){
    return tf.tidy(() => {
      const Q = this.splitHeads(Qin.matMul(this.WQ).add(this.bQ));
      const K = this.splitHeads(Kin.matMul(this.WK).add(this.bK));
      const V = this.splitHeads(Vin.matMul(this.WV).add(this.bV));
      const r = this.sdpa.forward(Q, K, V, maskAdd);
      const output = this.combineHeads(r.output).matMul(this.WO).add(this.bO);
      return { output, weights: { pre: r.pre, post: r.post } };
    });
  }
  /** 释放本层全部变量 */
  dispose(){
    [this.WQ,this.WK,this.WV,this.WO,this.bQ,this.bK,this.bV,this.bO]
      .forEach(v => v.dispose());
  }
}

/* ============================================================
   模块6：层级编排（Post-LN，与原论文 "Add & Norm" 一致）
   ============================================================ */
class LayerNorm {
  /** @param {number} dModel 归一化维度 */
  constructor(dModel){
    this.gamma = toVar(tf.ones([dModel]));
    this.beta  = toVar(tf.zeros([dModel]));
  }
  /** γ·(x−μ)/√(σ²+ε)+β，沿最后一维 */
  normalize(x){
    return tf.tidy(() => {
      const { mean, variance } = tf.moments(x, -1, true);
      return x.sub(mean).div(variance.add(1e-6).sqrt())
              .mul(this.gamma).add(this.beta);
    });
  }
  dispose(){ this.gamma.dispose(); this.beta.dispose(); }
}

class FeedForward {
  /**
   * FFN(x) = max(0, xW₁+b₁)W₂ + b₂（d → d_ff → d，中间扩维见 spec 数据示例）
   */
  constructor(dModel, dFF){
    this.W1 = toVar(glorotInit([dModel, dFF])); this.b1 = toVar(tf.zeros([dFF]));
    this.W2 = toVar(glorotInit([dFF, dModel])); this.b2 = toVar(tf.zeros([dModel]));
  }
  /**
   * @param {tf.Tensor} x [B,L,d]
   * @param {Object|null} snap 可选快照收集器：{mid:number[][][]} 记录 ReLU 后中间激活
   */
  forward(x, snap = null){
    return tf.tidy(() => {
      const mid = tf.relu(x.matMul(this.W1).add(this.b1));
      if(snap) snap.mid = mid.arraySync();
      return mid.matMul(this.W2).add(this.b2);
    });
  }
  dispose(){ this.W1.dispose(); this.b1.dispose(); this.W2.dispose(); this.b2.dispose(); }
}

class EncoderLayer {
  constructor(dModel, numHeads, dFF){
    this.mha = new MultiHeadAttention(dModel, numHeads);
    this.ffn = new FeedForward(dModel, dFF);
    this.ln1 = new LayerNorm(dModel);
    this.ln2 = new LayerNorm(dModel);
  }
  /**
   * x ← LN1(x + MHA(x))；x ← LN2(x + FFN(x))
   * @param {tf.Tensor} x [B,L,d]
   * @param {Object|null} snap 可选快照收集器（引擎回放用）：
   *        {attnOut, afterAdd1, ffnMid, out, msAttn, msFfn}
   * @returns {{output:tf.Tensor, weights:{pre:number[][][],post:number[][][]}}}
   */
  forward(x, snap = null){
    return tf.tidy(() => {
      let t = performance.now();
      const attn = this.mha.forward(x, x, x, null);
      if(snap){
        snap.attnOut = attn.output.arraySync();
        snap.msAttn = performance.now() - t;
      }
      t = performance.now();
      const h = this.ln1.normalize(x.add(attn.output));
      if(snap){
        snap.afterAdd1 = h.arraySync();
        snap.msAdd1 = performance.now() - t;
      }
      t = performance.now();
      const fSnap = snap ? {} : null;
      const fOut = this.ffn.forward(h, fSnap);
      if(snap){
        snap.ffnMid = fSnap.mid;
        snap.msFfn = performance.now() - t;
      }
      t = performance.now();
      const out = this.ln2.normalize(h.add(fOut));
      if(snap){
        snap.out = out.arraySync();
        snap.msAdd2 = performance.now() - t;
      }
      return { output: out, weights: attn.weights };
    });
  }
  dispose(){ this.mha.dispose(); this.ffn.dispose(); this.ln1.dispose(); this.ln2.dispose(); }
}

class DecoderLayer {
  constructor(dModel, numHeads, dFF){
    this.selfMha  = new MultiHeadAttention(dModel, numHeads);
    this.crossMha = new MultiHeadAttention(dModel, numHeads);
    this.ffn = new FeedForward(dModel, dFF);
    this.ln1 = new LayerNorm(dModel);
    this.ln2 = new LayerNorm(dModel);
    this.ln3 = new LayerNorm(dModel);
  }
  /**
   * 掩码自注意力 → Add&Norm → 交叉注意力(Q=解码器,K/V=编码器输出) → Add&Norm → FFN → Add&Norm
   * @param {tf.Tensor} x 解码器输入 [B,Lt,d]
   * @param {tf.Tensor} encOut 编码器记忆 [B,Ls,d]
   * @param {tf.Tensor} selfMask 因果掩码 [1,1,Lt,Lt]
   * @returns {{output:tf.Tensor, selfWeights:Object, crossWeights:Object}}
   */
  forward(x, encOut, selfMask){
    return tf.tidy(() => {
      const s = this.selfMha.forward(x, x, x, selfMask);
      const h1 = this.ln1.normalize(x.add(s.output));
      const c = this.crossMha.forward(h1, encOut, encOut, null);
      const h2 = this.ln2.normalize(h1.add(c.output));
      const out = this.ln3.normalize(h2.add(this.ffn.forward(h2)));
      return { output: out, selfWeights: s.weights, crossWeights: c.weights };
    });
  }
  dispose(){
    this.selfMha.dispose(); this.crossMha.dispose();
    this.ffn.dispose();
    this.ln1.dispose(); this.ln2.dispose(); this.ln3.dispose();
  }
}

class Transformer {
  constructor(){ this._built = false; }

  /**
   * 按当前 Config 构建全部权重；重复调用会先释放旧模型。
   * Embedding 查表后乘 √d_model（原论文做法）。
   */
  build(){
    if(this._built) this.disposeAll();
    const d = Config.d_model, h = Config.num_heads,
          f = Config.d_ff, N = Config.num_layers;
    this.V = window.Vocab.length;
    this.embed = toVar(glorotInit([this.V, d])); // 词嵌入表 E[V,d]
    this.outW  = toVar(glorotInit([d, this.V])); // 输出投影 W_out[d,V]
    this.outB  = toVar(tf.zeros([this.V]));
    /* 位置编码常量表（非训练参数），按需 slice */
    this.peMaxLen = 64;
    this.pe = PositionalEncoding.encode(this.peMaxLen, d);
    this.encLayers = []; this.decLayers = [];
    for(let i = 0; i < N; i++){
      this.encLayers.push(new EncoderLayer(d, h, f));
      this.decLayers.push(new DecoderLayer(d, h, f));
    }
    this._built = true;
  }
  disposeAll(){
    if(!this._built) return;
    this.encLayers.forEach(l => l.dispose());
    this.decLayers.forEach(l => l.dispose());
    this.embed.dispose(); this.outW.dispose(); this.outB.dispose();
    this.pe.dispose();
    this._built = false;
  }
  /**
   * 编码器主体（须在调用方的 tidy 作用域内使用）。
   * @param {number[]} srcIds 源序列索引
   * @param {Array|null} collect 可选收集器：逐层注意力 {pre,post} 快照
   * @returns {tf.Tensor} 编码器输出 [B,Ls,d]
   * @private
   */
  _encodeTensor(srcIds, collect = null){
    const Ls = srcIds.length;
    const ids = tf.tensor1d(srcIds, 'int32');
    let x = tf.gather(this.embed, ids)
            .mul(Math.sqrt(Config.d_model))
            .reshape([1, Ls, Config.d_model]);
    x = x.add(this.pe.slice([0, 0, 0], [1, Ls, Config.d_model]));
    for(const layer of this.encLayers){
      const r = layer.forward(x);
      if(collect) collect.push({ pre: r.weights.pre, post: r.weights.post });
      x = r.output;
    }
    return x;
  }
  /**
   * 编码器前向（对外接口）：tidy 包裹，返回纯数组快照。
   * @param {number[]} tokenIds 源序列索引
   * @param {boolean} withSnaps true 时逐子层记录快照与耗时（引擎回放用）
   * @returns {{emb:number[][][], afterPE:number[][][], perLayer:Array,
   *            final:number[][][], timings:Object}}
   */
  encode(tokenIds, withSnaps = false){
    return tf.tidy(() => {
      const collected = [];
      const timings = {};
      const Ls = tokenIds.length;
      let t = performance.now();
      const ids = tf.tensor1d(tokenIds, 'int32');
      let x = tf.gather(this.embed, ids)
              .mul(Math.sqrt(Config.d_model))
              .reshape([1, Ls, Config.d_model]);
      const embSnap = x.arraySync();
      if(withSnaps) timings.emb = performance.now() - t;
      t = performance.now();
      x = x.add(this.pe.slice([0, 0, 0], [1, Ls, Config.d_model]));
      const peSnap = x.arraySync();
      if(withSnaps) timings.pe = performance.now() - t;
      for(let i = 0; i < this.encLayers.length; i++){
        const snap = withSnaps ? {} : null;
        t = performance.now();
        const r = this.encLayers[i].forward(x, snap);
        x = r.output;
        const entry = { pre: r.weights.pre, post: r.weights.post };
        if(withSnaps){ entry.snap = snap; entry.msTotal = performance.now() - t; }
        collected.push(entry);
      }
      const final = x.arraySync();
      return { emb: embSnap, afterPE: peSnap, perLayer: collected,
               final, timings };
    });
  }
  /**
   * 解码器单步（teacher-forcing）：输入含 <bos> 的目标前缀，
   * 内部在同一 tidy 中重算编码器得到张量形式的 K/V 记忆。
   * @param {number[]} targetIds 目标前缀索引（首元素为 <bos> 的索引）
   * @param {number[]} srcIds 源序列索引
   * @returns {{logits:number[], probs:number[], selfWeights, crossWeights, decFinal:number[][][]}}
   */
  decodeStep(targetIds, srcIds){
    return tf.tidy(() => {
      const mem = this._encodeTensor(srcIds);          // [1,Ls,d]
      const Lt = targetIds.length;
      const ids = tf.tensor1d(targetIds, 'int32');
      let y = tf.gather(this.embed, ids)
              .mul(Math.sqrt(Config.d_model))
              .reshape([1, Lt, Config.d_model]);
      y = y.add(this.pe.slice([0, 0, 0], [1, Lt, Config.d_model]));
      const selfMask = causalMask(Lt);
      let sw = null, cw = null;
      for(const layer of this.decLayers){
        const r = layer.forward(y, mem, selfMask);
        y = r.output; sw = r.selfWeights; cw = r.crossWeights;
      }
      /* 取最后位置的隐状态 [1,1,d] 做输出投影 → logits [1,1,V] → softmax 概率 */
      const last = y.slice([0, Lt - 1, 0], [1, 1, Config.d_model]);
      const logits = last.matMul(this.outW).add(this.outB);
      return {
        logits: logits.arraySync()[0][0],
        probs: tf.softmax(logits, -1).arraySync()[0][0],
        selfWeights: sw, crossWeights: cw,
        decFinal: y.arraySync()
      };
    });
  }
}

/* ============================================================
   模块10：注意力热力图 + Top-K 概率条形图
   配色（spec）：蓝(低) - 白 - 红(高)；pre 阶段以 0 为中点对称映射
   ============================================================ */
const AttentionHeatmap = {
  /** 当前数据 {tokens, colTokens, layers:[{pre,post}], kind} */
  data: null,
  head: 0,          // 0-based
  stage: 'post',    // 'pre' | 'post'
  layer: 0,         // 0-based
  RAMP: ['#2166ac', '#f7f7f7', '#b2182b'],

  /**
   * 设置数据并重绘（含控件重建）。
   * @param {{tokens:string[], colTokens?:string[], layers:Array, kind?:string}} d
   *        layers[i] = {pre:number[][][], post:number[][][]}
   */
  setData(d){
    this.data = d;
    this.head = 0; this.layer = 0;
    /* 自/交叉切换段控：仅当携带双份数据（解码演示）时显示 */
    document.getElementById('kind-seg').style.display = d.alt ? '' : 'none';
    this._buildControls();
    this._draw();
  },
  /**
   * 解码演示专用：同时装载自注意力与交叉注意力两套数据，
   * 通过 #kind-seg 切换显示。
   * @param {Object} selfData {tokens, layers, kind:'self'}
   * @param {Object} crossData {tokens, colTokens, layers, kind:'cross'}
   */
  setDual(selfData, crossData){
    selfData.alt = crossData;
    crossData.alt = selfData;
    this.setData(selfData);
  },
  /** 切换自/交叉视图（alt 互指成对） */
  setKind(k){
    if(this.data && this.data.alt && this.data.kind !== k){
      this.setData(this.data.alt);
    }
    document.querySelectorAll('#kind-seg button').forEach(b =>
      b.classList.toggle('on', b.dataset.kind === k));
  },
  setHead(i){ this.head = i; this._syncControls(); this._draw(); },
  setStage(s){ this.stage = s; this._syncControls(); this._draw(); },
  setLayer(i){ this.layer = i; this._syncControls(); this._draw(); },
  clear(){ document.getElementById('attn-heatmap').innerHTML = ''; this.data = null; },

  _buildControls(){
    const seg = document.getElementById('head-seg');
    const H = this.data.layers[0].post.length;
    seg.innerHTML = '';
    for(let h = 0; h < H; h++){
      const b = document.createElement('button');
      b.textContent = h + 1;
      b.addEventListener('click', () => this.setHead(h));
      seg.appendChild(b);
    }
    const sel = document.getElementById('layer-select');
    const n = this.data.layers.length;
    sel.style.display = n > 1 ? '' : 'none';
    sel.innerHTML = Array.from({length:n}, (_,i) =>
      '<option value="' + i + '">' + (this.data.kind === 'cross' ? '交叉' : '第') +
      (n > 1 ? (i + 1) + (this.data.kind === 'cross' ? '' : ' 层') : '') + '</option>').join('');
    sel.onchange = e => this.setLayer(Number(e.target.value));
    document.querySelectorAll('#stage-seg button').forEach(b => {
      b.onclick = () => this.setStage(b.dataset.stage);
    });
    this._syncControls();
  },
  _syncControls(){
    document.querySelectorAll('#head-seg button').forEach((b,i) =>
      b.classList.toggle('on', i === this.head));
    document.querySelectorAll('#stage-seg button').forEach(b =>
      b.classList.toggle('on', b.dataset.stage === this.stage));
    const sel = document.getElementById('layer-select');
    if(sel.options.length) sel.value = String(this.layer);
  },

  /** 主绘制：L×L 单元格 + 行列标签 + tooltip + 渐变图例 */
  _draw(){
    const host = document.getElementById('attn-heatmap');
    if(!this.data){ host.innerHTML = ''; return; }
    const L = this.data.tokens.length;
    const cols = this.data.colTokens || this.data.tokens;
    const mat = this.data.layers[this.layer][this.stage][this.head]; // [Lq,Lk]
    const ramp = d3.interpolateRgbBasis(this.RAMP);
    /* 值域：post 为概率 [0,1]；pre 以 0 为中点对称（发散语义正确） */
    let domainMin = 0, domainMax = 1;
    if(this.stage === 'pre'){
      let m = 0;
      mat.forEach(row => row.forEach(v => { m = Math.max(m, Math.abs(v)); }));
      domainMin = -m; domainMax = m;
    }
    const t = v => (v - domainMin) / (domainMax - domainMin || 1);
    const cell = Math.max(26, Math.min(42, Math.floor(560 / (L + 1))));
    const mL = 64, mT = 64, mR = 10, mB = 30;
    const W = mL + L * cell + mR, H = mT + L * cell + mB;
    const svg = d3.select('#attn-heatmap').html('')
      .append('svg').attr('width', W).attr('height', H);
    const tip = document.getElementById('hm-tip');
    /* 列标签（Key，旋转） */
    svg.append('g').selectAll('text').data(cols).join('text')
      .attr('transform', (d,i) =>
        'translate(' + (mL + i*cell + cell/2 + 4) + ',' + (mT - 8) + ') rotate(-40)')
      .attr('font-size', 12).attr('fill','var(--c-text-dim)')
      .style('font-family','var(--font-mono)')
      .text(d => d.length > 6 ? d.slice(0,6) + '…' : d);
    /* 行标签（Query） */
    svg.append('g').selectAll('text').data(this.data.tokens).join('text')
      .attr('x', mL - 8).attr('y', (d,i) => mT + i*cell + cell/2 + 4)
      .attr('text-anchor','end').attr('font-size',12)
      .attr('fill','var(--c-text-dim)').style('font-family','var(--font-mono)')
      .text(d => d.length > 6 ? d.slice(0,6) + '…' : d);
    /* 单元格（2px 表面间隙 = 描边同背景色） */
    const layer = this.layer, stage = this.stage;
    for(let r = 0; r < L; r++){
      for(let c = 0; c < L; c++){
        const v = mat[r][c];
        svg.append('rect')
          .attr('x', mL + c*cell + 1).attr('y', mT + r*cell + 1)
          .attr('width', cell - 2).attr('height', cell - 2).attr('rx', 3)
          .attr('fill', ramp(Math.max(0, Math.min(1, t(v)))))
          .on('mousemove', ev => {
            tip.innerHTML = 'Q="<b>' + this.data.tokens[r] + '</b>" K="<b>' +
              cols[c] + '</b>"<br>' + (stage === 'post' ? 'P=' : 'score=') +
              (Math.abs(v) < 1e-4 && stage === 'post' ? v.toExponential(1) : v.toFixed(4));
            tip.style.opacity = 1;
            tip.style.left = (ev.clientX + 14) + 'px';
            tip.style.top  = (ev.clientY + 14) + 'px';
          })
          .on('mouseleave', () => { tip.style.opacity = 0; });
      }
    }
    /* 渐变图例 */
    const lgX = mL, lgY = H - 12, lgW = 120, lgH = 8;
    const defs = svg.append('defs');
    const grad = defs.append('linearGradient').attr('id','hm-ramp');
    for(let s = 0; s <= 10; s++)
      grad.append('stop').attr('offset', s*10 + '%').attr('stop-color', ramp(s/10));
    svg.append('rect').attr('x',lgX).attr('y',lgY-lgH-2).attr('width',lgW)
       .attr('height',lgH).attr('rx',3).attr('fill','url(#hm-ramp)');
    svg.append('text').attr('x',lgX).attr('y',lgY+8).attr('font-size',10.5)
       .attr('fill','var(--c-text-dim)').style('font-family','var(--font-mono)')
       .text(stage === 'post' ? '0' : domainMin.toFixed(2));
    svg.append('text').attr('x',lgX+lgW).attr('y',lgY+8).attr('font-size',10.5)
       .attr('text-anchor','end').attr('fill','var(--c-text-dim)')
       .style('font-family','var(--font-mono)')
       .text(stage === 'post' ? '1' : domainMax.toFixed(2));
  }
};

/* ---------- Top-K 概率条形图（单系列：直接数值标注，无需图例） ---------- */
const TopKChart = {
  /**
   * 渲染水平条形组（用于步骤日志内嵌）。
   * @param {{token:string,prob:number}[]} items 已排序的 Top-K 项
   * @returns {string} HTML 片段
   */
  render(items){
    const max = Math.max(...items.map(i => i.prob), 1e-9);
    return items.map(it => {
      const pct = (it.prob * 100).toFixed(1);
      const w = Math.max(2, it.prob / max * 100);
      return '<div class="bar-row"><span style="min-width:64px;">' + it.token +
        '</span><span class="bar-track"><span class="bar-fill" style="width:' +
        w + '%"></span></span><span style="min-width:48px;text-align:right;">' +
        pct + '%</span></div>';
    }).join('');
  }
};

/* ============================================================
   模块11：前向传播引擎（快照式）+ 数据流分步动画
   ============================================================ */
/** 嵌套数组的形状，如 [1, 5, 512] */
function shapeOf(a){
  const s = []; let x = a;
  while(Array.isArray(x)){ s.push(x.length); x = x[0]; }
  return s;
}
/** 嵌套数组的 min / max / mean（两位小数） */
function statsOf(a){
  const flat = a.flat(Infinity);
  let mn = Infinity, mx = -Infinity, sum = 0;
  for(const v of flat){ if(v < mn) mn = v; if(v > mx) mx = v; sum += v; }
  return { min:+mn.toFixed(2), max:+mx.toFixed(2),
           mean:+(sum / flat.length).toFixed(2) };
}

const ForwardEngine = {
  /**
   * 一次性跑完编码器前向（tidy 内），产出纯数据步骤快照供动画回放。
   * @param {string} text 用户输入文本
   * @returns {{tokens:string[], oov:number, steps:Object[],
   *            attnLayers:Array, totalMs:number}}
   */
  run(text){
    const t0 = performance.now();
    const tokens = tokenizer.tokenize(text);
    /* 未登录词 → <unk>（避免 tf.gather 越界） */
    const unk = window.Vocab.indexOf('<unk>');
    let oov = 0;
    const ids = tokens.map(tk => {
      const i = window.Vocab.indexOf(tk);
      if(i < 0){ oov++; return unk; }
      return i;
    });
    const enc = transformer.encode(ids, true);
    const totalMs = performance.now() - t0;
    const steps = [];
    /* ① 分词 */
    steps.push({ label:'分词', moduleId:'input', tokens, ms:0,
      meta: tokens.length + ' 个 token' +
            (oov ? '（' + oov + ' 个未登录词以 <unk> 代替）' : '') });
    /* ② Embedding */
    steps.push({ label:'Embedding 查表 × √d_model', moduleId:'embed',
      shape: fmtShape(shapeOf(enc.emb)), stats: statsOf(enc.emb),
      ms: +(enc.timings.emb || 0).toFixed(1) });
    /* ③ + 位置编码 */
    steps.push({ label:'+ 位置编码', moduleId:'pe',
      shape: fmtShape(shapeOf(enc.afterPE)), stats: statsOf(enc.afterPE),
      ms: +(enc.timings.pe || 0).toFixed(1) });
    /* ④ 逐层：注意力 → Add&Norm → FFN → Add&Norm */
    enc.perLayer.forEach((lw, i) => {
      const s = lw.snap;
      steps.push({ label:'第 ' + (i+1) + ' 层 · 多头自注意力', moduleId:'enc-mha',
        layer:i, shape: fmtShape(shapeOf(s.attnOut)), stats: statsOf(s.attnOut),
        ms:+s.msAttn.toFixed(1),
        note:'注意力分数 [' + Config.num_heads + ', ' + tokens.length + ', ' +
             tokens.length + '] 已同步到热力图' });
      steps.push({ label:'第 ' + (i+1) + ' 层 · Add & Norm', moduleId:'enc-an1',
        layer:i, shape: fmtShape(shapeOf(s.afterAdd1)), stats: statsOf(s.afterAdd1),
        ms:+s.msAdd1.toFixed(1), note:'残差连接 + LayerNorm' });
      steps.push({ label:'第 ' + (i+1) + ' 层 · FFN 中间层（ReLU 后）', moduleId:'enc-ffn',
        layer:i, shape: fmtShape(shapeOf(s.ffnMid)), stats: statsOf(s.ffnMid),
        ms:+s.msFfn.toFixed(1), note:'扩维至 d_ff=' + Config.d_ff });
      steps.push({ label:'第 ' + (i+1) + ' 层 · Add & Norm', moduleId:'enc-an2',
        layer:i, shape: fmtShape(shapeOf(s.out)), stats: statsOf(s.out),
        ms:+s.msAdd2.toFixed(1) });
    });
    /* ⑤ 最终输出表示 */
    steps.push({ label:'编码器最终输出表示', moduleId:'enc-an2',
      shape: fmtShape(shapeOf(enc.final)), stats: statsOf(enc.final),
      ms:+totalMs.toFixed(1), note:'总耗时（含快照取数）' });
    return { tokens, oov, steps, attnLayers: enc.perLayer, totalMs };
  }
};

const DataFlowAnimator = {
  timer:null, steps:[], idx:0, playing:false,
  /**
   * 分步回放。步进间隔随步骤总数自适应（总时长约 3.6s）。
   * @param {Object[]} steps
   * @param {{onStep:Function, onDone:Function}} opts
   */
  play(steps, opts){
    this.stop(); this.idx = 0; this.steps = steps;
    const interval = Math.max(120, Math.min(420, Math.floor(3600 / steps.length)));
    this.playing = true;
    const tick = () => {
      if(this.idx >= this.steps.length){
        this.playing = false;
        if(opts.onDone) opts.onDone();
        return;
      }
      const s = this.steps[this.idx++];
      opts.onStep(s, this.idx - 1);
      this.timer = setTimeout(tick, interval);
    };
    tick();
  },
  stop(){ if(this.timer){ clearTimeout(this.timer); this.timer = null; } this.playing = false; }
};

/** 步骤 → 日志行 HTML（①②… 编号 + 形状 + 统计 + 耗时） */
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function logRowHTML(s, idx){
  const num = CIRCLED[idx] || (idx + 1) + '.';
  let html = '<span class="log-step">' + num + ' ' + s.label + '</span>';
  if(s.tokens){
    html += '<br>' + s.tokens.map(t => '<span class="chip">' + t + '</span>').join('');
  }
  if(s.shape) html += '<br><span class="log-shape">' + s.shape + '</span>';
  const meta = [];
  if(s.stats) meta.push('min ' + s.stats.min + ' · max ' + s.stats.max +
                        ' · mean ' + s.stats.mean);
  if(s.ms !== undefined) meta.push(s.ms + ' ms');
  if(meta.length) html += '<span class="log-meta">' + meta.join(' · ') + '</span>';
  if(s.note) html += '<span class="log-meta" style="color:var(--c-accent);">' +
                     s.note + '</span>';
  return '<li>' + html + '</li>';
}

/* ============================================================
   模块12：Decoder 逐词生成演示（设计决策 D8：展示机制而非语言能力）
   ============================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));

const DecoderDemo = {
  running: false,

  /** 主流程：从 <bos> 开始逐步预测，展示掩码自注意力/交叉注意力/Top-5 分布 */
  async run(){
    if(this.running){ this.running = false; return; }
    const text = document.getElementById('input-text').value;
    if(!text.trim()) return;
    this.running = true;
    DataFlowAnimator.stop();
    const log = document.getElementById('step-log');
    log.innerHTML = '';
    ArchitectureRenderer.clearHighlight();

    const tokens = tokenizer.tokenize(text);
    const unk = window.Vocab.indexOf('<unk>');
    const srcIds = tokens.map(tk => {
      const i = window.Vocab.indexOf(tk);
      return i < 0 ? unk : i;
    });
    /* 免责说明（D8） */
    log.insertAdjacentHTML('beforeend',
      '<li><span class="log-note">⚠️ 权重为随机初始化，生成文本无语言意义——' +
      '本演示展示因果掩码、交叉注意力与逐词预测机制。</span></li>');
    ArchitectureRenderer.highlight(['dec-input', 'dec-embed']);
    await sleep(500);

    let target = [window.Vocab.indexOf('<bos>')];
    const maxSteps = Math.min(tokens.length + 3, 8);
    const generated = ['<bos>'];

    for(let s = 0; s < maxSteps && this.running; s++){
      const t0 = performance.now();
      const r = transformer.decodeStep(target, srcIds);
      const ms = +(performance.now() - t0).toFixed(1);
      const order = [...r.probs.keys()].sort((a, b) => r.probs[b] - r.probs[a]);
      const top5 = order.slice(0, 5)
        .map(i => ({ token: window.Vocab[i], prob: r.probs[i] }));
      const next = order[0];
      const nextTok = window.Vocab[next];

      /* 热力图：奇偶步交替展示自/交叉注意力（用户可手动切换） */
      const targetToks = generated.slice();
      const showCross = s % 2 === 1;
      AttentionHeatmap.setDual(
        { tokens: targetToks,
          layers: [{ pre: r.selfWeights.pre, post: r.selfWeights.post }],
          kind: 'self' },
        { tokens: targetToks, colTokens: tokens,
          layers: [{ pre: r.crossWeights.pre, post: r.crossWeights.post }],
          kind: 'cross' });
      ArchitectureRenderer.highlight(showCross
        ? ['dec-cross', 'out'] : ['dec-masked-mha', 'out']);

      /* 日志：前缀 → Top-5 分布 → 选中 */
      log.insertAdjacentHTML('beforeend',
        '<li class="current">' +
        '<span class="log-step">第 ' + (s + 1) + ' 步 · 前缀「' +
        generated.join(' ') + '」</span>' +
        TopKChart.render(top5) +
        '<span class="log-meta">选中「<b>' + nextTok + '</b>」 p=' +
        r.probs[next].toFixed(3) + ' · ' + ms + ' ms' +
        (showCross ? ' · 热力图=交叉注意力' : ' · 热力图=自注意力(掩码)') +
        '</span></li>');
      [...log.children].forEach(li => {
        if(!li.classList.contains('current')) li.classList.add('done');
      });
      log.lastElementChild.scrollIntoView({ block:'nearest' });
      document.getElementById('tensor-tracker').innerHTML =
        '<b>Decoder 第 ' + (s + 1) + ' 步</b><br>' +
        'logits <b>[1, 1, ' + window.Vocab.length + ']</b><br>' +
        'softmax 后概率和 = 1<br>耗时 ' + ms + ' ms';

      target.push(next);
      generated.push(nextTok);
      if(next === window.Vocab.indexOf('<eos>')) break;
      await sleep(700);
    }
    if(this.running){
      log.insertAdjacentHTML('beforeend',
        '<li><span class="log-step">生成结束：</span> ' +
        generated.slice(1).map(t => '<span class="chip">' + t + '</span>').join('') +
        '</li>');
    }
    this.running = false;
  }
};

document.getElementById('run-decoder').addEventListener('click',
  () => DecoderDemo.run());

/* ============================================================
   模块14（接线部分）：超参数面板事件绑定
   ============================================================ */
function bindHyperPanel(){
  const map = {
    'hp-d-model':'d_model', 'hp-num-heads':'num_heads',
    'hp-num-layers':'num_layers', 'hp-dropout':'dropout_rate'
  };
  for(const [id,key] of Object.entries(map)){
    document.getElementById(id).addEventListener('change', e => {
      const v = Number(e.target.value);
      Config[key] = v;
      if(key === 'd_model') Config.d_ff = 4 * v;
      /* 广播配置变化：架构图/参数统计/引擎在各自模块中监听刷新 */
      window.dispatchEvent(new CustomEvent('config-changed'));
    });
  }
  window.addEventListener('config-changed', renderParamSummary);
}
bindHyperPanel();
renderParamSummary();

/* 位置编码波形：随序列长度与超参数变化刷新 */
function curSeqLen(){
  return tokenizer.tokenize(document.getElementById('input-text').value).length;
}
window.addEventListener('config-changed',
  () => PEWave.render(curSeqLen(), Config.d_model));
document.getElementById('input-text').addEventListener('input',
  () => PEWave.render(curSeqLen(), Config.d_model));
PEWave.render(curSeqLen(), Config.d_model);

/* ============================================================
   模块14（续）：主控制器 App —— 事件绑定与状态管理
   ============================================================ */
const App = {
  lastRun: null,

  /** 「开始前向传播」：计算一次 → 热力图就绪 → 分步动画回放 */
  runForward(){
    const text = document.getElementById('input-text').value;
    if(!text.trim()) return;
    DecoderDemo.running = false;   // 打断解码演示
    DataFlowAnimator.stop();
    const log = document.getElementById('step-log');
    log.innerHTML = '';
    ArchitectureRenderer.clearHighlight();
    const result = ForwardEngine.run(text);
    this.lastRun = result;
    /* 热力图数据就绪（默认展示最后一层） */
    AttentionHeatmap.setData({
      tokens: result.tokens, layers: result.attnLayers, kind: 'self' });
    AttentionHeatmap.setLayer(result.attnLayers.length - 1);
    DataFlowAnimator.play(result.steps, {
      onStep: (s, idx) => this._applyStep(s, idx),
      onDone: () => ArchitectureRenderer.clearHighlight()
    });
  },
  /** 单步应用：高亮模块 + 追加日志 + 更新张量追踪器 */
  _applyStep(s, idx){
    ArchitectureRenderer.highlight([s.moduleId]);
    if(s.layer !== undefined) AttentionHeatmap.setLayer(s.layer);
    const log = document.getElementById('step-log');
    [...log.children].forEach(li => {
      li.classList.remove('current'); li.classList.add('done');
    });
    log.insertAdjacentHTML('beforeend', logRowHTML(s, idx));
    const li = log.lastElementChild;
    li.classList.add('current');
    li.scrollIntoView({ block:'nearest' });
    document.getElementById('tensor-tracker').innerHTML =
      '<b>当前张量</b> · ' + s.label + '<br>' +
      (s.shape ? '形状 <b>' + s.shape + '</b><br>' : '') +
      (s.stats ? 'min ' + s.stats.min + ' / max ' + s.stats.max +
                ' / mean ' + s.stats.mean : '') +
      (s.ms !== undefined ? '<br>耗时 ' + s.ms + ' ms' : '');
  },
  /** 超参数或输入变化时重置运行状态 */
  resetRunState(){
    DecoderDemo.running = false;
    DataFlowAnimator.stop();
    document.getElementById('step-log').innerHTML = '';
    document.getElementById('tensor-tracker').innerHTML =
      '<b>当前张量</b><br>待运行…';
    AttentionHeatmap.clear();
    ArchitectureRenderer.clearHighlight();
  }
};

document.getElementById('run-forward').addEventListener('click',
  () => App.runForward());

/* 配置变化：清空运行状态（模型已由模块6监听重建） */
window.addEventListener('config-changed', () => App.resetRunState());

  '运行「开始前向传播」后，此处显示逐层注意力热力图</div>';

/* 自/交叉注意力切换按钮 */
document.querySelectorAll('#kind-seg button').forEach(b =>
  b.addEventListener('click', () => AttentionHeatmap.setKind(b.dataset.kind)));

(function initTheme(){
  const btn=document.getElementById('theme-toggle');
  const saved=localStorage.getItem('theme');
  if(saved) document.documentElement.dataset.theme=saved;
  syncLabel();
  btn.addEventListener('click',()=>{
    const cur=document.documentElement.dataset.theme==='dark'?'dark':'light';
    const next=cur==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    localStorage.setItem('theme',next);
    syncLabel();
  });
  function syncLabel(){
    const dark=document.documentElement.dataset.theme==='dark';
    btn.textContent=dark?'☀️ 浅色模式':'🌙 深色模式';
  }
})();
</script>
